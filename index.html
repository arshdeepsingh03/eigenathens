<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple, welcoming website." />
    <title>EigenAthens — Make room for what matters</title>
    <style>
      :root { --ink:#172018; --muted:#657067; --cream:#f7f5ef; --blue:#1769d1; --line:#dedfd8; }
      * { box-sizing:border-box; }
      body { margin:0; color:var(--ink); background:var(--cream); font:16px/1.5 Arial, Helvetica, sans-serif; }
      .wrap { width:min(1120px, calc(100% - 40px)); margin:auto; }
      nav { display:flex; align-items:center; justify-content:space-between; padding:24px 0; }
      .brand { font-weight:800; letter-spacing:-.06em; font-size:1.35rem; text-decoration:none; color:inherit; }
      .links { display:flex; align-items:center; gap:28px; }
      .links a { color:var(--ink); text-decoration:none; font-size:.92rem; }
      .button { color:var(--blue)!important; font-weight:700; }
      main { min-height:calc(100vh - 82px); display:grid; place-items:center; padding:56px 0 72px; }
      .hero { width:min(680px, 100%); }
      .eyebrow { display:inline-flex; gap:8px; align-items:center; color:var(--muted); font-size:.83rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
      .eyebrow::before { content:""; width:9px; height:9px; border-radius:50%; background:#76a52b; }
      h1 { margin:18px 0; font:700 clamp(3.6rem, 8vw, 6.7rem)/.94 Georgia, 'Times New Roman', serif; letter-spacing:-.075em; }
      .lede { max-width:510px; margin:0 0 28px; color:var(--muted); font-size:1.12rem; }
      .actions { display:flex; gap:13px; flex-wrap:wrap; }
      .actions a { color:var(--blue); text-decoration:none; font-weight:700; }
      .note { margin-top:22px; color:var(--muted); font-size:.86rem; }
      footer { border-top:1px solid var(--line); padding:18px 0 24px; color:var(--muted); font-size:.85rem; }
      @media (max-width:720px) { .links a:not(.button) { display:none; } h1 { font-size:4rem; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <nav>
        <a class="brand" href="#">EigenAthens</a>
        <div class="links"><a href="#about">About</a><a href="#journal">Journal</a><a class="button" href="mailto:hello@example.com">Say hello</a></div>
      </nav>
      <main>
        <section class="hero" id="about">
          <div>
            <span class="eyebrow">A little more room</span>
            <h1>Make room for what matters.</h1>
            <p class="lede">Thoughtful tools and gentle prompts for making a life that feels like your own.</p>
            <div class="actions"><a class="primary" href="#journal">Explore the journal</a><a class="secondary" href="mailto:hello@example.com">Work with us →</a></div>
            <p class="note">No noise. Just useful ideas, sent occasionally.</p>
          </div>
        </section>
      </main>
      <footer id="journal">© 2026 EigenAthens. Made with intention.</footer>
    </div>
  </body>
</html>
