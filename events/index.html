<!DOCTYPE html>
<html>

<head>
  <title>eigen events</title>

  <style>
    body { font-family:'Times New Roman', Times, serif; background-color:rgb(185,179,175); }

    .event-row { display:flex; min-width:700px; }

    .poster-column { width:200px; flex-shrink:0; }
    .poster-image { width:180px; }

    .details-column { width:300px; min-width:250px; }
    .detail-row { display:flex; }
    .detail-label { width:70px; flex-shrink:0; }
    .detail-value { width:180px; }

    .action-column { width:200px; min-width:150px; white-space:nowrap; }
  </style>
</head>

<body>

  <center><p>ull find events list here</p></center>

  <div class="event-row">

    <div class="poster-column">
      <img class="poster-image" src="1/poster.jpg">
    </div>

    <div class="details-column">
      <div class="detail-row"><div class="detail-label">Venue:</div><div class="detail-value">Vancouver, Canada</div></div>
      <div class="detail-row"><div class="detail-label">Date:</div><div class="detail-value">September 30</div></div>
      <div class="detail-row"><div class="detail-label">Time:</div><div class="detail-value">7:00 PM</div></div>
    </div>

    <div class="action-column">
      <!-- slash in 1/ means go into the folder "1" and serve index.html -->
      <p><a href="1/">Free admission.</a></p>
      <button>Register</button>
    </div>

  </div>

</body>
</html>
