    function nodeTypeName(node)
    {
        var names = {
            1: "ELEMENT_NODE",
            2: "ATTRIBUTE_NODE",
            3: "TEXT_NODE",
            4: "CDATA_SECTION_NODE",
            5: "ENTITY_REFERENCE_NODE",
            6: "ENTITY_NODE",
            7: "PROCESSING_INSTRUCTION_NODE",
            8: "COMMENT_NODE",
            9: "DOCUMENT_NODE",
            10: "DOCUMENT_TYPE_NODE",
            11: "DOCUMENT_FRAGMENT_NODE",
            12: "NOTATION_NODE"
        };
        return names[node.nodeType];
    }

    function isWhitespaceText(node) {
        return (node.nodeType === Node.TEXT_NODE && node.nodeValue.trim() === "");
    }

    function printNode(node, depth, maxTextLen) {
        // stringify prints\n instead of an actual newline. 
        if(isWhitespaceText(node)) return;
        var value = node.nodeValue === null ? "null" : JSON.stringify(node.nodeValue.slice(0,maxTextLen));
        var length = node.nodeValue === null ? 0 : node.nodeValue.length;
        console.log("     ".repeat(depth) + "TYPE: " + nodeTypeName(node) + "|NAME: " + node.nodeName + "|VALUE: " + value + "(total "+length+" chars)");
        // console.log("      ".repeat(depth) + "text content: "+node.textContent);

        // console.log("\n");
    }
    function dft(root, depth) {
        printNode(root, depth, 30);
            for(let i=0;i<root.childNodes.length;i++) {
                dft(root.childNodes[i], depth+1);
            }
            // console.log("\n");
    }
    function printDom() {
        dft(document.getRootNode(), 0);

    function makeDetail(label, value)
{
    var row;
    var labelDiv;
    var valueDiv;

    row = document.createElement("div");
    row.className = "detail-row";

    labelDiv = document.createElement("div");
    labelDiv.className = "detail-label";
    labelDiv.textContent = label + ":";

    valueDiv = document.createElement("div");
    valueDiv.className = "detail-value";
    valueDiv.textContent = value;

    row.appendChild(labelDiv);
    row.appendChild(valueDiv);

    return row;
}
function makeEvent(event)
{
    var eventRow, posterColumn, posterImage, detailsColumn;
    var actionColumn, freeText, form, hiddenGroup, emailInput, button, status;

    eventRow = document.createElement("div");
    eventRow.className = "event-row";

    posterColumn = document.createElement("div");
    posterColumn.className = "poster-column";

    posterImage = document.createElement("img");
    posterImage.className = "poster-image";
    posterImage.src = event.poster;

    posterColumn.appendChild(posterImage);

    detailsColumn = document.createElement("div");
    detailsColumn.className = "details-column";

    detailsColumn.appendChild(makeDetail("Group ID", event.group));
    detailsColumn.appendChild(makeDetail("Area", event.area));
    detailsColumn.appendChild(makeDetail("Format", event.format));
    detailsColumn.appendChild(makeDetail("Frequency", event.frequency));
    detailsColumn.appendChild(makeDetail("Meetings", event.meetings));
    detailsColumn.appendChild(makeDetail("Time", event.time));
    detailsColumn.appendChild(makeDetail("Meeting days", event.days));
    detailsColumn.appendChild(makeDetail("Venue", event.venue));
    detailsColumn.appendChild(makeDetail("Span", event.span));

    actionColumn = document.createElement("div");
    actionColumn.className = "action-column";

    freeText = document.createElement("p");
    freeText.textContent = "Free admission.";

    form = document.createElement("form");
    form.className = "registration-form";
    form.action = appsScriptURL;
    form.method = "post";

    hiddenGroup = document.createElement("input");
    hiddenGroup.type = "hidden";
    hiddenGroup.name = "group";
    hiddenGroup.value = event.group;

    emailInput = document.createElement("input");
    emailInput.type = "email";
    emailInput.name = "email";
    emailInput.required = true;

    button = document.createElement("button");
    button.type = "submit";
    button.textContent = "Submit";

    status = document.createElement("p");
    status.className = "status";

    form.appendChild(hiddenGroup);
    form.appendChild(emailInput);
    form.appendChild(button);
    form.appendChild(status);

    actionColumn.appendChild(freeText);
    actionColumn.appendChild(form);

    eventRow.appendChild(posterColumn);
    eventRow.appendChild(detailsColumn);
    eventRow.appendChild(actionColumn);

    return eventRow;
}

    function formSubmitted(event)
    {
      var form;
      var button;
      var status;

      form = this;

      button =
        form.querySelector("button");

      status =
        form.querySelector(".status");


      button.disabled = true;

      button.textContent =
        "Submitting...";

      status.textContent =
        "Please wait.";


      /*
       * We are NOT calling:
       *
       * event.preventDefault();
       *
       * Therefore the browser still performs
       * the normal HTML form submission.
       *
       * The POST request will be made to:
       *
       * appsScriptURL
       *
       * and the browser will navigate to
       * whatever response/redirect Google returns.
       */
    }


    function installFormHandlers()
    {
      var forms;
      var i;

      forms =
        document.querySelectorAll(
          ".registration-form"
        );


      for (i = 0; i < forms.length; i++)
      {
        forms[i].addEventListener(
          "submit",
          formSubmitted
        );
      }
    }


    function eventsRequestChanged()
    {
      var events;
      var eventsContainer;
      var i;


      console.log(
        "readyState:",
        this.readyState
      );


      /*
       * XMLHttpRequest may call this function
       * several times as the request progresses.
       *
       * readyState == 4 means:
       *
       * DONE
       */

      if (this.readyState != 4)
      {
        return;
      }


      console.log(
        "HTTP status:",
        this.status
      );


      console.log(
        "Raw response text:",
        this.responseText
      );


      if (this.status != 200)
      {
        console.log(
          "events.json could not be loaded."
        );

        return;
      }


      /*
       * responseText is just a JavaScript string
       * containing the bytes of the response body
       * after the browser has decoded them as text.
       *
       * JSON.parse turns that JSON text into
       * ordinary JavaScript objects.
       */

      events =
        JSON.parse(
          this.responseText
        );


      eventsContainer =
        document.getElementById(
          "events"
        );


      for (i = 0; i < events.length; i++)
      {
        eventsContainer.innerHTML +=
          makeEvent(
            events[i]
          );
      }


      /*
       * The forms were created by makeEvent().
       *
       * Therefore we wait until AFTER the
       * event HTML has been inserted before
       * searching for the forms.
       */

      installFormHandlers();
    }
